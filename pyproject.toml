[project]
name = "letssing-playlist-builder"
version = "0.1.0"
description = "Busca músicas, monta uma playlist e gera um DLC de Let's Sing via ultrastar2singIt."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "yt-dlp[default]>=2026.10.26",
    "deno>=2.7.4",  # runtime JS exigido pelo yt-dlp para o YouTube
    "keyring>=25",
]

[project.scripts]
# intermediário que adapta a linha de comando do conversor ao RAD atual (ver radshim.py)
letssing-rad = "letssing.converter.radshim:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["letssing"]

[dependency-groups]
dev = ["pytest>=8", "chardet>=5"]  # chardet: mesmo detector usado pelo conversor
# só se o ultrastar2singIt for usado pelo código-fonte (pasta) em vez do .exe
converter-src = ["pyyaml", "munch", "chardet", "requests", "levenshtein", "beautifulsoup4"]

[tool.uv]
# Nunca o Python da Microsoft Store: ele redireciona AppData\Roaming para dentro do
# pacote dele, e o processo filho (o Python do UltraSinger, que o uv instala em
# AppData\Roaming\uv\python) falha com "No Python at ...".
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
